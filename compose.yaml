services:
  postgres:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      POSTGRES_DB: internship_helper
      POSTGRES_USER: internship_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship_app -d internship_helper"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: internship-helper:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://internship_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/internship_helper
    command: ["node", "dist/src/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: internship-helper:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://internship_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/internship_helper
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  import-jobs:
    image: internship-helper:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://internship_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/internship_helper
    command: ["node", "dist/src/db/importJobs.js"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
