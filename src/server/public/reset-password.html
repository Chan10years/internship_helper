<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11110f">
    <title>设置新密码 — INTERNSHIP</title>
    <link rel="stylesheet" href="/auth.css">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-scene reset-scene" aria-label="重新出发">
        <a class="auth-brand" href="/">INTERNSHIP</a>
        <div class="scene-index" aria-hidden="true">02 / RESET</div>
        <div class="scene-copy">
          <p>START AGAIN</p>
          <h1>换把钥匙，<br><span>继续向前。</span></h1>
          <p class="scene-note">重置完成后，其他设备上的旧登录状态会全部失效。</p>
        </div>
      </section>
      <section class="auth-panel" aria-labelledby="resetTitle">
        <div class="auth-panel-top"><a href="/auth.html">← 返回登录</a><span>ONE-TIME LINK</span></div>
        <div class="auth-card">
          <p class="eyebrow">SECURE RESET</p>
          <h2 id="resetTitle">设置你的<br><span>新密码。</span></h2>
          <form id="resetForm" class="auth-form" novalidate>
            <label>
              <span>新密码（至少 12 位）</span>
              <input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128" placeholder="输入一个新的长密码">
            </label>
            <button class="submit-button" type="submit">保存新密码 <span aria-hidden="true">↗</span></button>
          </form>
          <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/auth.js"></script>
  </body>
</html>
